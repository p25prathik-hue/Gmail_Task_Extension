<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; font-family: Inter, "Segoe UI", Roboto, system-ui, sans-serif; }
    body { margin: 0; width: 340px; color: #0f172a; background: #fff; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: linear-gradient(135deg, #6366f1, #4338ca); color: #fff; }
    header b { font-size: 16px; flex: 1; }
    header small { opacity: .85; font-size: 11px; }
    main { padding: 14px 16px 16px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .03em; }
    input[type=email], input[type=password] { width: 100%; border: 1px solid #e2e8f0; border-radius: 10px; padding: 9px 11px; font-size: 13px; outline: none; }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
    button, .btn { display: block; width: 100%; text-align: center; border: 0; border-radius: 10px; padding: 10px; margin-top: 12px; font-weight: 600; font-size: 13px; cursor: pointer; background: #4f46e5; color: #fff; text-decoration: none; }
    button:hover, .btn:hover { background: #4338ca; }
    .sec { background: #f1f5f9; color: #334155; }
    .sec:hover { background: #e2e8f0; }
    .err { background: #fef2f2; color: #b91c1c; border-radius: 10px; padding: 8px 10px; font-size: 12px; margin-top: 10px; display: none; }
    .muted { color: #64748b; font-size: 12px; }
    .task { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    .task input { margin-top: 2px; accent-color: #22c55e; }
    .task .t { flex: 1; cursor: pointer; }
    .task .d { color: #94a3b8; font-size: 11px; }
    .done { text-decoration: line-through; color: #94a3b8; }
    .toggle { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-top: 12px; }
    .hint { background: #eef2ff; color: #3730a3; border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.45; margin-bottom: 8px; }
    kbd { background: #fff; border: 1px solid #c7d2fe; border-radius: 4px; padding: 0 4px; font-size: 11px; }
    a { color: #4f46e5; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" width="30" height="30" alt="">
    <b>MailTasks</b>
    <small id="who"></small>
  </header>
  <main id="app"></main>
  <script src="popup.js" type="module"></script>
</body>
</html>
